[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-agent"
version = "0.1.0"
description = "Local-first personal programming assistant MVP with FastAPI, SSE, and a transparent Web UI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Solo Agent Contributors" }
]
dependencies = [
  "aiosqlite>=0.20,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "langchain-core>=1.3,<2.0",
  "langgraph>=1.1,<2.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "tree-sitter>=0.24,<1.0",
  "tree-sitter-language-pack>=0.9,<1.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0"
]

[project.scripts]
solo-agent-web = "solo_agent.web.app:main"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.setuptools.data-files]
"frontend/templates" = ["frontend/templates/*.html"]
"frontend/static" = [
  "frontend/static/*.css",
  "frontend/static/*.js"
]

[tool.ruff]
line-length = 128
target-version = "py311"
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".uv-cache",
  ".venv",
  "build",
  "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
